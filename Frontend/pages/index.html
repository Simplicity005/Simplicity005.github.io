  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arjun Sanesh | Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Advent+Pro:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

  <body>
    <svg style="display: none">
      <filter id="liquid-turing-pattern">
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.04"
          numOctaves="4"
          result="noise"
        />
        <feDisplacementMap
          in="SourceGraphic"
          in2="noise"
          scale="35"
          xChannelSelector="R"
          yChannelSelector="G"
        />
      </filter>
    </svg>
    <div id="bg-pattern"></div>

    <nav class="navbar">
      <div class="nav-center">
        <div class="nav-items"><a href="#about">About Me</a></div>
        <div class="nav-items"><a href="#work">My Work</a></div>
        <div class="nav-items"><a href="#contact">Contact</a></div>
      </div>
    </nav>

    <main class="grid-container">
      <div class="card profile-card">
        <div class="profile-img-window">
          <img
            src="../assets/images/1000027072 (1).png"
            alt="Portrait of Arjun Sanesh"
            class="profile-card-img"
          />
        </div>

        <div class="profile-card-content">
          <div class="profile-card-top">
            <h3>Hi, I am</h3>
          </div>
          <div class="profile-card-name"><h2>Arjun Sanesh</h2></div>
          <div class="profile-card-bio">
            <p>Software Engineer // Systems Enthusiast.</p>
            <p>
              Just another guy who codes and loves designs. I personaly love the
              game Limbo btw =)
            </p>
          </div>
          <div class="btn-neo-teal">
            <a href="#contact">Resume</a>
          </div>
        </div>
      </div>

      <div class="experience-card card">
        <div class="experience-title">
          <h1>Experience</h1>
        </div>
      </div>
